# ============================================================
# BriNora — Netlify configuration
# Static site, no build step. Served from the repository root.
# ============================================================

[build]
  publish = "."
  # No build command — this is plain HTML/CSS/JS.

# Long-cache static assets (images, icons, fonts you may add later).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML: always revalidate so edits appear immediately after deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS / JS: short cache (rename the file if you ever need a hard refresh).
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Sensible baseline security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Optional: serve index.html for any unknown path. Real files are matched
# first, so this never shadows /assets, /styles.css, etc. Future-proofs you
# if you ever move from #hash routes to /path routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
